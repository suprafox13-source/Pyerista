<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Pyerista</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 style="text-align:center;">Pyerista</h1>

<div class="project-card">
  <h2>Blink (LED Yakıp Söndürme)</h2>

  <img src="assets/ardunioproject1.png" alt="Blink Projesi">

  <p>
    Ardunionun en basit projesi LED yakıp söndürme.
  </p>

  <button onclick="openModal()">Detayları Gör</button>
</div>

<!-- DETAY MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">×</span>

    <h3>Kod</h3>
    <pre>
void setup() {
  pinMode(13, OUTPUT);
}

void loop() {
  digitalWrite(13, HIGH);
  delay(1000);
  digitalWrite(13, LOW);
  delay(1000);
}
    </pre>
  </div>
</div>

<script>
function openModal() {
  document.getElementById("modal").style.display = "block";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
