<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Üyelik</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container" id="authBox">
  <h1>Üyelik</h1>

  <input id="username" placeholder="Kullanıcı Adı">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Şifre">
  <textarea id="bio" placeholder="Profil açıklaması"></textarea>
  <input type="file" id="photo">

  <button onclick="register()">Kayıt Ol</button>
  <button onclick="login()">Giriş Yap</button>

  <div class="info" id="info"></div>
  <div class="info">Toplam Üye: <span id="count">0</span></div>
</div>

<div class="container profile" id="profileBox" style="display:none;">
  <img id="profileImg">
  <h2 id="profileName"></h2>
  <p id="profileBio"></p>
  <button onclick="logout()">Çıkış Yap</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwl2xoth2_jFKGvCHb-NDqS6IXhakGRQM",
  authDomain: "pyerista.firebaseapp.com",
  projectId: "pyerista",
  storageBucket: "pyerista.firebasestorage.app",
  messagingSenderId: "398648392787",
  appId: "1:398648392787:web:e0dc220487d6661a4e5aa6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const info = document.getElementById("info");
const countEl = document.getElementById("count");

async function updateCount(){
  const snap = await getDocs(collection(db,"users"));
  countEl.textContent = snap.size;
}
updateCount();

window.register = async ()=>{
  const u = username.value.trim();
  const e = email.value.trim();
  const p = password.value;
  const b = bio.value;
  const file = photo.files[0];

  if(!u||!e||!p){ info.textContent="Alanları doldur"; return;}

  if((await getDoc(doc(db,"users",u))).exists()){
    info.textContent="Bu kullanıcı adı alınmış";
    return;
  }

  const cred = await createUserWithEmailAndPassword(auth,e,p);

  let imgURL="";
  if(file){
    const r = ref(storage,"profiles/"+cred.user.uid);
    await uploadBytes(r,file);
    imgURL = await getDownloadURL(r);
  }

  await setDoc(doc(db,"users",u),{
    uid:cred.user.uid,
    bio:b,
    photo:imgURL
  });

  info.textContent="Kayıt başarılı 🎉";
  updateCount();
};

window.login = async ()=>{
  await signInWithEmailAndPassword(auth,email.value,password.value);
};

window.logout = async ()=>{
  await signOut(auth);
  location.reload();
};

onAuthStateChanged(auth, async user=>{
  if(user){
    const snap = await getDocs(collection(db,"users"));
    snap.forEach(d=>{
      if(d.data().uid===user.uid){
        authBox.style.display="none";
        profileBox.style.display="block";
        profileName.textContent=d.id;
        profileBio.textContent=d.data().bio;
        profileImg.src=d.data().photo || "https://via.placeholder.com/120";
      }
    });
  }
});
</script>

</body>
</html>
