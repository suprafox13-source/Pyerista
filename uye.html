<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Üyelik Sistemi</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f8;
}
.container{
  max-width:420px;
  margin:70px auto;
  background:#fff;
  padding:30px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}
h1{text-align:center;}
input, textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:6px;
  border:1px solid #ccc;
}
textarea{resize:none;}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#0b3c6d;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
button.logout{
  background:#b30000;
}
.info{
  margin-top:12px;
  text-align:center;
  font-weight:bold;
}
.profile{
  text-align:center;
}
.profile img{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:10px;
}
.hide{display:none;}
</style>
</head>

<body>

<div class="container">

<!-- KAYIT / GİRİŞ -->
<div id="authBox">
  <h1>Üyelik</h1>

  <input id="username" placeholder="Kullanıcı Adı">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Şifre">
  <input id="photo" placeholder="Profil Fotoğraf URL">
  <textarea id="bio" placeholder="Profil açıklaması"></textarea>

  <button onclick="register()">Kayıt Ol</button>
  <button onclick="login()">Giriş Yap</button>

  <div class="info" id="info"></div>
  <div class="info">Toplam Üye: <span id="count">0</span></div>
</div>

<!-- PROFİL -->
<div id="profileBox" class="hide profile">
  <img id="pImg">
  <h2 id="pName"></h2>
  <p id="pBio"></p>
  <button class="logout" onclick="logout()">Çıkış Yap</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwl2xoth2_jFKGvCHb-NDqS6IXhakGRQM",
  authDomain: "pyerista.firebaseapp.com",
  projectId: "pyerista",
  storageBucket: "pyerista.firebasestorage.app",
  messagingSenderId: "398648392787",
  appId: "1:398648392787:web:e0dc220487d6661a4e5aa6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const info = document.getElementById("info");
const countEl = document.getElementById("count");
const authBox = document.getElementById("authBox");
const profileBox = document.getElementById("profileBox");

async function updateCount(){
  const snap = await getDocs(collection(db,"users"));
  countEl.textContent = snap.size;
}
updateCount();

window.register = async ()=>{
  const u = username.value.trim();
  const e = email.value.trim();
  const p = password.value;
  const photo = document.getElementById("photo").value;
  const bio = document.getElementById("bio").value;

  if(!u||!e||!p){
    info.textContent="Tüm alanları doldur";
    return;
  }

  if((await getDoc(doc(db,"users",u))).exists()){
    info.textContent="Bu kullanıcı adı alınmış";
    return;
  }

  try{
    const cred = await createUserWithEmailAndPassword(auth,e,p);
    await setDoc(doc(db,"users",u),{
      uid:cred.user.uid,
      username:u,
      photo:photo,
      bio:bio
    });
    info.textContent="Kayıt başarılı 🎉";
    updateCount();
  }catch(err){ info.textContent=err.message; }
};

window.login = async ()=>{
  try{
    await signInWithEmailAndPassword(auth,email.value,password.value);
  }catch(e){ info.textContent=e.message; }
};

window.logout = async ()=>{
  await signOut(auth);
};

onAuthStateChanged(auth, async user=>{
  if(user){
    const snap = await getDocs(collection(db,"users"));
    snap.forEach(d=>{
      if(d.data().uid===user.uid){
        authBox.classList.add("hide");
        profileBox.classList.remove("hide");
        pName.textContent=d.data().username;
        pBio.textContent=d.data().bio || "";
        pImg.src=d.data().photo || "https://via.placeholder.com/120";
      }
    });
  }else{
    authBox.classList.remove("hide");
    profileBox.classList.add("hide");
  }
});
</script>

</body>
</html>
