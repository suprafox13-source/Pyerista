<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Üyelik</title>

<style>
body{
  font-family:Arial, sans-serif;
  background:#f4f6f8;
}

.container{
  max-width:400px;
  margin:80px auto;
  background:#fff;
  padding:25px;
  border-radius:12px;
}

input,button{
  width:100%;
  padding:10px;
  margin:8px 0;
}

button{
  background:#0b3c6d;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.profile-box{
  position:fixed;
  top:15px;
  right:15px;
  display:flex;
  align-items:center;
  gap:10px;
}

.profile-box img{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #0b3c6d;
}
</style>
</head>

<body>

<!-- ÜST SAĞ -->
<a id="uyeBtn" class="uye-btn">Üye Ol</a>

<div id="profileBox" class="profile-box" style="display:none;">
  <img id="profileImg">
  <button onclick="logout()">Çıkış</button>
</div>

<!-- FORM -->
<div class="container">
  <h2>Üyelik</h2>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Şifre">
  <input id="photo" type="file" accept="image/*">

  <button onclick="register()">Kayıt Ol</button>
  <button onclick="login()">Giriş Yap</button>

  <div id="info"></div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "API_KEY",
  authDomain: "pyerista.firebaseapp.com",
  projectId: "pyerista",
  storageBucket: "pyerista.appspot.com",
  appId: "APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const uyeBtn = document.getElementById("uyeBtn");
const profileBox = document.getElementById("profileBox");
const profileImg = document.getElementById("profileImg");
const info = document.getElementById("info");

window.register = async () => {
  try{
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const file = document.getElementById("photo").files[0];

    const cred = await createUserWithEmailAndPassword(auth, email, password);

    let photoURL = "";
    if(file){
      const imgRef = ref(storage, "profiles/" + cred.user.uid);
      await uploadBytes(imgRef, file);
      photoURL = await getDownloadURL(imgRef);
    }

    await setDoc(doc(db,"users",cred.user.uid), {
      email,
      photoURL
    });

    info.textContent = "Kayıt başarılı";
  }catch(e){
    info.textContent = e.message;
  }
}

window.login = async () => {
  try{
    await signInWithEmailAndPassword(
      auth,
      email.value,
      password.value
    );
  }catch(e){
    info.textContent = e.message;
  }
}

window.logout = async () => {
  await signOut(auth);
}

onAuthStateChanged(auth, async (user)=>{
  if(user){
    const snap = await getDoc(doc(db,"users",user.uid));
    profileImg.src = snap.data().photoURL || "";
    uyeBtn.style.display="none";
    profileBox.style.display="flex";
  }else{
    uyeBtn.style.display="block";
    profileBox.style.display="none";
  }
});
</script>

</body>
</html>
