<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Üye Ol</title>
<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f8;
}
.container{
  max-width:400px;
  margin:80px auto;
  background:#fff;
  padding:30px;
  border-radius:12px;
  text-align:center;
}
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:6px;
  border:1px solid #ccc;
}
button{
  width:100%;
  padding:12px;
  background:#0b3c6d;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="container">
<h1>Üye Ol</h1>

<input type="text" id="username" placeholder="Kullanıcı Adı">
<input type="password" id="password" placeholder="Şifre">

<button onclick="uyeOl()">Kaydol</button>
</div>

<script>
function uyeOl(){
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  if(user=="" || pass==""){
    alert("Boş bırakma");
    return;
  }

  localStorage.setItem("uye", user);

  // üye sayacı
  let sayac = localStorage.getItem("uyeSayisi");
  if(!sayac){
    sayac = 0;
  }
  sayac++;
  localStorage.setItem("uyeSayisi", sayac);

  alert("Başarıyla üye oldun!");
  window.location.href = "index.html";
}
</script>

</body>
</html>

  import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {

    projectId: "BURAYA",
    storageBucket: "BURAYA",
    messagingSenderId: "BURAYA",
    appId: "BURAYA"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
</script>
