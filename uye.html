<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Üye Ol / Giriş Yap</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f8;
}
.container{
  max-width:400px;
  margin:80px auto;
  background:#fff;
  padding:30px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}
h1{
  text-align:center;
}
input{
  <textarea id="bio" placeholder="Profil açıklaması"
style="width:100%;padding:12px;border-radius:6px;border:1px solid #ccc;resize:none;height:80px;"></textarea>

<input type="text" id="photo" placeholder="Profil Resmi URL (isteğe bağlı)">

  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:6px;
  border:1px solid #ccc;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  background:#0b3c6d;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.info{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
  <h1>Üyelik</h1>

  <input type="text" id="username" placeholder="Kullanıcı Adı">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Şifre (en az 6 karakter)">

  <button onclick="register()">Kayıt Ol</button>
  <button onclick="login()">Giriş Yap</button>

  <div class="info" id="info"></div>
  <div class="info">Toplam Üye: <span id="count">0</span></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔹 Firebase Ayarları */
const firebaseConfig = {
  apiKey: "AIzaSyCwl2xoth2_jFKGvCHb-NDqS6IXhakGRQM",
  authDomain: "pyerista.firebaseapp.com",
  projectId: "pyerista",
  storageBucket: "pyerista.firebasestorage.app",
  messagingSenderId: "398648392787",
  appId: "1:398648392787:web:e0dc220487d6661a4e5aa6"
};

/* 🔹 Firebase Başlat */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const info = document.getElementById("info");
const countEl = document.getElementById("count");

/* 🔹 Üye sayısını güncelle */
async function updateCount(){
  const snap = await getDocs(collection(db, "users"));
  countEl.textContent = snap.size;
}
updateCount();

/* 🔹 KAYIT OL */
window.register = async function(){
  const usernameInput = document.getElementById("username");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  const username = usernameInput.value.trim();
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if(!username || !email || !password){
    info.textContent = "Tüm alanları doldur";
    return;
  }

  if(password.length < 6){
    info.textContent = "Şifre en az 6 karakter olmalı";
    return;
  }

  const userDoc = await getDoc(doc(db, "users", username));
  if(userDoc.exists()){
    info.textContent = "Bu kullanıcı adı alınmış";
    return;
  }

  try{
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await setDoc(doc(db, "users", username), {
      uid: cred.user.uid,
      email: email
    });
    info.textContent = "Kayıt başarılı 🎉";
    updateCount();
  }catch(e){
    info.textContent = e.message;
  }
};

/* 🔹 GİRİŞ YAP */
window.login = async function(){
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  try{
    await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
    info.textContent = "Giriş başarılı ✅";
  }catch(e){
    info.textContent = e.message;
  }
};

/* 🔹 OTURUM KONTROL */
onAuthStateChanged(auth, (user)=>{
  if(user){
    info.textContent = "Zaten giriş yapılmış 👌";
  }
});
</script>

</body>
</html>
